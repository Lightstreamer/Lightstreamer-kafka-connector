---
name: quickstart-kafka-connector-schema-registry
services:
  kafka-connector:
    container_name: kafka-connector
    image: lightstreamer-kafka-connector:${VERSION}
    depends_on:
      init-broker:
        condition: service_completed_successfully    
      schema-registry:
        condition: service_started
    ports:
      - 8080:8080
    volumes:
      - ./web:/lightstreamer/pages/QuickStart
      - ./adapters.xml:/lightstreamer/adapters/lightstreamer-kafka-connector/adapters.xml
      - ./log4j.properties:/lightstreamer/adapters/lightstreamer-kafka-connector/log4j.properties
      - ./secrets/kafka-connector:/lightstreamer/adapters/lightstreamer-kafka-connector/secrets

  producer:
    container_name: producer
    depends_on:
      init-broker:
        condition: service_completed_successfully
    build:
      context: ../quickstart-producer
    configs:
      - source: producer.properties
        target: /usr/app/producer.properties
    volumes:
      - ./secrets/producer:/usr/app/secrets
    command: ["--bootstrap-servers", "broker:29094", "--topic", "stocks", "--config-file", "/usr/app/producer.properties"]

  broker:
    image: apache/kafka
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
      - "9094:9094"
      - "8082:8082"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CLIENT_SSL:SSL,CLIENT_SSL_HOST:SSL,CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'CLIENT_SSL://broker:29094,CLIENT_SSL_HOST://localhost:9094,PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SSL_TRUSTSTORE_FILENAME: broker.truststore.p12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: broker_truststore_credentials
      KAFKA_SSL_KEYSTORE_FILENAME: broker.keystore.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: broker_keystore_credentials
      KAFKA_SSL_KEY_CREDENTIALS: broker_key_credentials
      KAFKA_SSL_CLIENT_AUTH: "required"
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CLIENT_SSL://broker:29094,CLIENT_SSL_HOST://0.0.0.0:9094,PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_REST_HOST_NAME: rest-proxy
      KAFKA_REST_BOOTSTRAP_SERVERS: 'broker:29092'
      KAFKA_REST_LISTENERS: 'http://0.0.0.0:8082'
    volumes:
      - ./secrets/broker:/etc/kafka/secrets

  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.1
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      init-broker:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
      - "8084:8084"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081,https://0.0.0.0:8084'
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION: /etc/schema-registry/secrets/schema-registry.truststore.p12
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD: schema-registry-truststore-password
      SCHEMA_REGISTRY_SSL_KEYSTORE_LOCATION: /etc/schema-registry/secrets/schema-registry.keystore.p12
      SCHEMA_REGISTRY_SSL_KEYSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_SSL_KEYSTORE_PASSWORD: schema-registry-keystore-password
      # A PKCS12 key store uses the key store password also for the private key. The key password
      # must be set explicitly, otherwise Schema Registry defaults to an empty one.
      SCHEMA_REGISTRY_SSL_KEY_PASSWORD: schema-registry-keystore-password
      SCHEMA_REGISTRY_SSL_CLIENT_AUTHENTICATION: REQUIRED
    volumes:
     - ./secrets/schema-registry:/etc/schema-registry/secrets

  init-broker:
    container_name: init-broker
    image: apache/kafka
    command: |
      /opt/kafka/bin/kafka-topics.sh --create --topic stocks --if-not-exists --bootstrap-server broker:29092
    depends_on:
        broker:
            condition: service_started

configs:
  producer.properties:
    content: |
      # Enable SSL
      security.protocol=SSL

      # Trust store configuration to authenticate the broker
      ssl.truststore.location=/usr/app/secrets/producer.truststore.p12
      ssl.truststore.type=PKCS12
      ssl.truststore.password=producer-truststore-password

      # Key store configuration for client authentication with the broker
      ssl.keystore.location=/usr/app/secrets/producer.keystore.p12
      ssl.keystore.type=PKCS12
      ssl.keystore.password=producer-keystore-password

      # Enable hostname verification of the broker certificate
      ssl.endpoint.identification.algorithm=https

      # Protobuf serializer with support for the Schema Registry
      value.serializer=io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer

      # Schema Registry URL
      schema.registry.url=https://schema-registry:8084

      # Trust store configuration to authenticate the Schema Registry
      schema.registry.ssl.truststore.location=/usr/app/secrets/producer.truststore.p12
      schema.registry.ssl.truststore.type=PKCS12
      schema.registry.ssl.truststore.password=producer-truststore-password

      # Key store configuration for client authentication with the Schema Registry
      schema.registry.ssl.keystore.location=/usr/app/secrets/producer.keystore.p12
      schema.registry.ssl.keystore.type=PKCS12
      schema.registry.ssl.keystore.password=producer-keystore-password

      # Enable hostname verification of the Schema Registry certificate. Unlike the Kafka client,
      # the Schema Registry client does not verify the hostname unless this is set.
      schema.registry.ssl.endpoint.identification.algorithm=https
